# Regras do gitleaks na esteira (auditoria 04/11/2026): as regras padrão,
# menos os valores FICTÍCIOS dos testes e do build da esteira.
# Nunca acrescente aqui um caminho de código de produção.
[extend]
useDefault = true

[allowlist]
description = "fixtures de teste e valor fictício do build da esteira"
paths = [
  '''^scripts/test-[^/]+$''',
  '''^scripts/pfx-de-teste\.ts$''',
]
regexes = [
  '''ci-somente-para-o-build''',
]
